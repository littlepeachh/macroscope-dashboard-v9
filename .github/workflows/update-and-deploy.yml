name: Update data and deploy public dashboard

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
      - "public/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "选择更新范围"
        required: true
        default: "all"
        type: choice
        options: [all, macro, global, close, fund, evening]
  schedule:
    - cron: "20 22 * * *"
    - cron: "10 2 * * *"
    - cron: "40 8 * * 1-5"
    - cron: "40 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macroscope-main-writer
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure every data file exists
        run: python scripts/ensure_data_files.py

      - name: Select update mode
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            MODE="all"
          elif [ "${{ github.event.schedule }}" = "20 22 * * *" ]; then
            MODE="global"
          elif [ "${{ github.event.schedule }}" = "10 2 * * *" ]; then
            MODE="macro"
          elif [ "${{ github.event.schedule }}" = "40 8 * * 1-5" ]; then
            MODE="close"
          elif [ "${{ github.event.schedule }}" = "40 10 * * *" ]; then
            MODE="evening"
          else
            MODE="all"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Selected mode: $MODE"

      - name: Fetch and cache public data
        continue-on-error: true
        run: python scripts/update_data.py --mode "${{ steps.select.outputs.mode }}"

      - name: Refresh A-share three-month daily series
        if: steps.select.outputs.mode == 'all' || steps.select.outputs.mode == 'close'
        continue-on-error: true
        run: python scripts/update_ashare_daily.py --days 95

      - name: Build static website
        run: python scripts/build_site.py

      - name: Validate complete project
        run: python scripts/validate_project.py

      - name: Persist refreshed cache and website
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SNAPSHOT="/tmp/macroscope-main-generated.tar"
          tar -cf "$SNAPSHOT" data public

          echo "Generated snapshot saved."
          echo "Uncommitted files before synchronization:"
          git status --short || true

          for attempt in 1 2 3; do
            echo "Synchronize and push attempt ${attempt}/3"

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            tar -xf "$SNAPSHOT"

            git add data public

            if git diff --cached --quiet; then
              echo "Remote main already contains the generated result."
              exit 0
            fi

            git commit -m "chore: refresh public dashboard data [skip ci]"

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Remote main changed before push; rebuilding the commit on the latest main."
            sleep $((attempt * 10))
          done

          echo "::error::Push failed after 3 attempts."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
